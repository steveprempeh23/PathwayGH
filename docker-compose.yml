services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # On first run, pull the two models this app needs:
    #   docker compose exec ollama ollama pull llama3.1:8b
    #   docker compose exec ollama ollama pull nomic-embed-text

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SQLITE_PATH=/code/data/app_state.db
      - CHROMA_PERSIST_DIR=/code/data/chroma
    volumes:
      - ./data:/code/data
    depends_on:
      - ollama

volumes:
  ollama_models:
